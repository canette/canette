name: Build Typescript

on:
  pull_request:
    branches:
      - '*'
    paths:
      - apps/ui/**
      - apps/api/**
      - apps/docs/content/**
      - apps/docs/public/schema/**
      - packages/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ 'ui', 'api' ]    
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    - name: Bun install
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Lint ${{ matrix.app }}
      run: bun run lint:${{ matrix.app }}

    - name: Build ${{ matrix.app }}
      run: bun run build:${{ matrix.app }}

    # The UI has no test suite yet.
    - name: Type-check api tests
      if: matrix.app == 'api'
      run: bun run --cwd apps/api typecheck:test

    - name: Test api
      if: matrix.app == 'api'
      run: bun run test:api
