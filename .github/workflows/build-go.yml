name: Build Go

on:
  pull_request:
    branches:
      - '*'
    paths:
      - apps/authgate/**
      - apps/builder/**
      - apps/controller/**
      - apps/logstreamer/**
      - packages/golib/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ 'apps/authgate', 'apps/builder', 'apps/controller', 'apps/logstreamer' ]
    env:
      # The repo-root go.work unifies all Go modules' dependency graphs, which can mask
      # a module whose own go.mod/go.sum is incomplete. Production builds (Dockerfiles)
      # only ever COPY a single module plus packages/golib, without go.work, so this
      # check must build in that same isolation to be meaningful.
      GOWORK: 'off'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build ${{ matrix.app }}
      run: go build -v ./...
      working-directory: ${{ matrix.app }}

    - name: Lint ${{ matrix.app }}
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        working-directory: ${{ matrix.app }}

    - name: Test ${{ matrix.app }}
      run: go test -v ./...
      working-directory: ${{ matrix.app }}
