{{- if and .Values.metrics.enabled .Values.metrics.prometheus.bundled.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canette-metrics-prometheus
  labels:
    {{- include "canette.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: canette-metrics-prometheus
  apiGroup: rbac.authorization.k8s.io
{{- end }}
