{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres-backup
    {{- include "canette.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-aws-cli
              image: {{ .Values.postgres.image }}
              imagePullPolicy: {{ include "canette.imagePullPolicy" .Values.postgres.image }}
              command:
                - sh
                - -c
                - |
                  mkdir -p /tools/etc/apk
                  cp /etc/apk/repositories /tools/etc/apk/repositories
                  apk add --no-cache --root /tools --initdb --keys-dir /etc/apk/keys aws-cli
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: {{ .Values.postgres.image }}
              imagePullPolicy: {{ include "canette.imagePullPolicy" .Values.postgres.image }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["sh", "/scripts/backup.sh"]
              env:
                - name: PATH
                  value: "/tools/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                - name: LD_LIBRARY_PATH
                  value: "/tools/usr/lib:/tools/lib"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL
                - name: BACKUP_S3_URI
                  value: {{ .Values.backup.s3.uri | quote }}
                {{- if .Values.backup.s3.region }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                {{- end }}
                {{- if .Values.backup.s3.endpoint }}
                - name: AWS_ENDPOINT_URL
                  value: {{ .Values.backup.s3.endpoint | quote }}
                {{- end }}
                {{- if .Values.backup.s3.secretRef.name }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.secretRef.name }}
                      key: {{ .Values.backup.s3.secretRef.accessKeyKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.secretRef.name }}
                      key: {{ .Values.backup.s3.secretRef.secretKeyKey }}
                {{- else }}
                - name: AWS_ACCESS_KEY_ID
                  value: {{ required "backup.s3.accessKey is required when backup.enabled=true and secretRef is not set" .Values.backup.s3.accessKey | quote }}
                - name: AWS_SECRET_ACCESS_KEY
                  value: {{ required "backup.s3.secretKey is required when backup.enabled=true and secretRef is not set" .Values.backup.s3.secretKey | quote }}
                {{- end }}
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: tools
              emptyDir: {}
            - name: script
              configMap:
                name: postgres-backup-script
                defaultMode: 0555
{{- end }}
